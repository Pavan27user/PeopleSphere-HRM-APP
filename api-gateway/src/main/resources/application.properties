server.port=8080
spring.application.name=peoplesphere-api-gateway
spring.cloud.gateway.routes[0].id=employees
spring.cloud.gateway.routes[0].uri=${EMPLOYEE_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/employees/**
spring.cloud.gateway.routes[1].id=attendance
spring.cloud.gateway.routes[1].uri=${ATTENDANCE_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/attendance/**
spring.cloud.gateway.routes[2].id=payroll
spring.cloud.gateway.routes[2].uri=${PAYROLL_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/payroll/**
spring.cloud.gateway.routes[3].id=notifications
spring.cloud.gateway.routes[3].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notifications/**
management.endpoints.web.exposure.include=health,info,metrics
